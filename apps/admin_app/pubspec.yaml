name: admin_app
resolution: workspace
description: "macOS admin app for Stepstones."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  material_ui: ^1.1.1
  intl: ^0.20.3
  go_router: ^18.0.0
  get_it: ^9.2.1
  flutter_bloc: ^9.1.1

  firebase_provider: ^1.0.0
  core: ^0.0.1
  auth: ^0.0.1
  admin_access: ^0.0.1
  admin_chants: ^0.0.1
  admin_presence: ^0.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
